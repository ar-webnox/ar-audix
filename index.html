<!doctype html>
<html lang="en" data-theme="dark" data-accent="sky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="AR AUDIX — a premium local music player. Your music, your device, nothing uploaded." />
    <title>AR AUDIX</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme, accent and motion preference before the first paint so nothing flashes.
      (function () {
        try {
          var root = document.documentElement;
          var t = JSON.parse(localStorage.getItem('ar-audix:v1:theme') || 'null');
          if (!t) {
            // First load after an update: fall back to the accent saved with the user's settings.
            var u = JSON.parse(localStorage.getItem('ar-audix:v1:user') || 'null');
            var s = u && u.settings;
            if (s && /^(sky|amber|rose|mint|violet)$/.test(s.accent) && (s.accentChosen || s.accent !== 'amber')) t = { accent: s.accent };
          }
          t = t || {};
          var mode = /^(dark|light|system)$/.test(t.mode) ? t.mode : 'dark';
          var scheme = mode === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : mode;
          root.setAttribute('data-theme', scheme);
          if (t.motion === 'reduced') root.setAttribute('data-motion', 'reduced');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', scheme === 'light' ? '#f5f4f1' : '#0a0b0e');
          if (!t.accent) return;
          root.setAttribute('data-accent', t.accent);
          if (t.accent === 'custom') {
            var c = (t.custom && t.custom[scheme]) || (scheme === 'dark' && t.color ? { color: t.color, ink: t.ink } : null);
            if (c && c.color && c.ink) {
              root.style.setProperty('--accent-custom', c.color);
              root.style.setProperty('--accent-ink', c.ink);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
