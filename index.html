<!doctype html>
<html lang="en" data-accent="sky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="AR AUDIX — a premium local music player. Your music, your device, nothing uploaded." />
    <title>AR AUDIX</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved accent before the first paint so there is no colour flash.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('ar-audix:v1:theme') || 'null');
          if (!t) {
            // First load after an update: fall back to the accent saved with the user's settings.
            var u = JSON.parse(localStorage.getItem('ar-audix:v1:user') || 'null');
            var s = u && u.settings;
            if (s && /^(sky|amber|rose|mint|violet)$/.test(s.accent) && (s.accentChosen || s.accent !== 'amber')) t = { accent: s.accent };
          }
          if (!t || !t.accent) return;
          var root = document.documentElement;
          root.setAttribute('data-accent', t.accent);
          if (t.accent === 'custom' && t.color && t.ink) {
            root.style.setProperty('--accent-custom', t.color);
            root.style.setProperty('--accent-ink', t.ink);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
